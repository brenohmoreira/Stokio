<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stokio">
  <defs>
    <linearGradient id="top" x1="256" y1="130" x2="256" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="left" x1="136" y1="200" x2="196" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cfe0f2"/>
      <stop offset="1" stop-color="#aec7e6"/>
    </linearGradient>
    <linearGradient id="right" x1="376" y1="200" x2="316" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaf2fb"/>
      <stop offset="1" stop-color="#cfe0f2"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#6f4e37"/>

  <!-- isometric box -->
  <g>
    <!-- top face -->
    <path d="M256 130 L376 200 L256 270 L136 200 Z" fill="url(#top)"/>
    <!-- left (front) face -->
    <path d="M136 200 L256 270 L256 400 L136 330 Z" fill="url(#left)"/>
    <!-- right (front) face -->
    <path d="M256 270 L376 200 L376 330 L256 400 Z" fill="url(#right)"/>

    <!-- packing tape down the front seam -->
    <path d="M256 270 L256 400" stroke="#26a69a" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
    <!-- tape on top -->
    <path d="M196 165 L316 235" stroke="#26a69a" stroke-width="16" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
